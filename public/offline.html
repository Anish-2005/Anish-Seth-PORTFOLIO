<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>You're offline · Anish Seth</title>
    <style>
      :root {
        --bg: #0b0b0c;
        --fg: #ededec;
        --muted: #a3a3a1;
        --line: rgba(255, 255, 255, 0.12);
        --accent: #ff4d63;
        color-scheme: dark light;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f5f2;
          --fg: #111110;
          --muted: #5c5c59;
          --line: rgba(17, 17, 16, 0.14);
          --accent: #c8193c;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 1.25rem;
      }
      main {
        width: min(34rem, 100%);
        border-top: 1px solid var(--line);
        padding-top: 2rem;
      }
      .label {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font: 500 0.72rem/1 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
      }
      h1 {
        margin: 1.4rem 0 0.8rem;
        font-size: clamp(2rem, 7vw, 2.8rem);
        line-height: 1.05;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 2rem;
      }
      button,
      a {
        font: inherit;
        font-size: 0.95rem;
        padding: 0.7rem 1.2rem;
        border: 1px solid var(--line);
        background: none;
        color: var(--fg);
        text-decoration: none;
        cursor: pointer;
      }
      button {
        background: var(--fg);
        color: var(--bg);
        border-color: var(--fg);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="label"><span class="dot"></span>Anish Seth</p>
      <h1>You're offline.</h1>
      <p>Pages you've already opened on this site still work without a connection. This one will load as soon as you're back online.</p>
      <div class="actions">
        <button type="button" onclick="location.reload()">Try again</button>
        <a href="/">Go to the home page</a>
      </div>
    </main>
  </body>
</html>
